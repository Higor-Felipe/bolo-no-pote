<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho - Doces no Pote</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style-carrinho.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Biblioteca QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <!-- Cabeçalho -->
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="fas fa-birthday-cake"></i> Doce Encanto
        </a>
      </div>
    </nav>

    <div class="container py-5" id="carrinho-page">
      <h2 class="mb-4 text-center" style="color: var(--secondary)">
        <i class="fas fa-shopping-cart"></i> Seu Carrinho
      </h2>

      <div id="carrinho-vazio" class="text-center py-5 d-none">
        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
        <p class="text-muted">Seu carrinho está vazio.</p>
        <a
          href="index.html"
          class="btn btn-primary"
          style="background: #59176a; border: none"
          >Escolher sabores</a
        >
      </div>

      <div id="carrinho-itens"></div>

      <div id="form-dados" class="mt-5 d-none">
        <h4><i class="fas fa-user"></i> Dados do Cliente</h4>
        <div class="mb-3">
          <label class="form-label">Nome completo *</label>
          <input type="text" id="nome-cliente" class="form-control" required />
        </div>

        <h4 class="mt-4">
          <i class="fas fa-money-bill-wave"></i> Método de Pagamento
        </h4>
        <div class="row">
          <div class="col-md-4 mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="pagamento"
                id="pag-pix"
                value="pix"
              />
              <label class="form-check-label fw-bold" for="pag-pix">PIX</label>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="pagamento"
                id="pag-dinheiro"
                value="dinheiro"
              />
              <label class="form-check-label fw-bold" for="pag-dinheiro"
                >Dinheiro</label
              >
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="pagamento"
                id="pag-cartao"
                value="cartao"
              />
              <label class="form-check-label fw-bold" for="pag-cartao"
                >Cartão (Déb/Créd)</label
              >
            </div>
          </div>
        </div>

        <div id="msg-pagamento" class="qrcode-placeholder"></div>

        <div class="aviso-pagamento">
          <spam>PAGAMENTOS IRÃO SER ACEITOS ATÉ DIA 17</spam>
        </div>
        <br /><br />

        <div class="aviso-retirada">
          <spam>Retirada será feita no dia 19 na Etec</spam>
        </div>
        <br /><br />

        <div class="horarios">
          <spam
            >🌟 Horários de visitação:<br />
            🕗 Manhã: 08h às 11h<br />
            🕓 Tarde: 14h às 17h<br />
            🌙 Noite: 19h às 22h<br />
          </spam>
        </div>

        <div class="text-center mt-4">
          <h3 class="total-price">
            Total: R$ <span id="total-valor">0,00</span>
          </h3>
          <button id="btn-concluir" class="btn btn-success btn-lg px-5 mt-3">
            <i class="fab fa-whatsapp"></i> Enviar Pedido no WhatsApp
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="JavaScript/script-carrinho.js"></script>
  </body>
</html>
